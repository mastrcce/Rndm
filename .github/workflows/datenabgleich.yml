# Wöchentlicher Datenabgleich mit OpenStreetMap (Overpass-API).
# Benötigt das Repository-Secret DATABASE_URL (z. B. Supabase-Connection-String) und DATABASE_SSL=true.
name: Datenabgleich OSM

on:
  schedule:
    - cron: "17 3 * * 1" # montags 03:17 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "overpass (live) oder seed (mitgelieferter Abzug)"
        default: overpass

jobs:
  import:
    if: ${{ vars.ENABLE_DATA_SYNC == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL: "true"
      NOMINATIM_USER_AGENT: "rohmilch-atlas-datenabgleich (github actions)"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run import:osm -- --mode ${{ github.event.inputs.mode || 'overpass' }}
      - run: npm run dedupe
